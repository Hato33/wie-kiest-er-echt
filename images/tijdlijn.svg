<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510">
  <title>Tijdlijn van de rechtszaak Bits of Freedom tegen Meta, van oktober 2025 tot maart 2026.</title>

  <!-- verticale lijn -->
  <line x1="24" y1="20" x2="24" y2="420" stroke="#4C566A" stroke-width="2"/>

  <!-- stippellijn: de zaak is nog niet voorbij -->
  <line x1="24" y1="420" x2="24" y2="500" stroke="#4C566A" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- punten -->
  <circle cx="24" cy="30" r="7" fill="#2E3440"/>
  <circle cx="24" cy="150" r="7" fill="#2E3440"/>
  <circle cx="24" cy="270" r="7" fill="#2E3440"/>
  <circle cx="24" cy="390" r="7" fill="#2E3440"/>

  <!-- tekst: de onderkant van de eerste regel ligt 6 pixels onder het midden van het punt,
       zodat de letters op dezelfde hoogte staan als het punt -->
  <g font-family="Helvetica, Arial, sans-serif">

    <!-- punt 1 -->
    <text x="48" y="36" font-size="16" font-weight="bold" fill="#2E3440">2 oktober 2025</text>
    <text x="48" y="56" font-size="15" fill="#2E3440">Uitspraak rechtbank Amsterdam</text>
    <text x="48" y="76" font-size="14" fill="#4C566A">Meta moet de keuze laten staan</text>

    <!-- punt 2 -->
    <text x="48" y="156" font-size="16" font-weight="bold" fill="#2E3440">28 oktober 2025</text>
    <text x="48" y="176" font-size="15" fill="#2E3440">Tussenbeslissing gerechtshof</text>
    <text x="48" y="196" font-size="14" fill="#4C566A">Aanpassen voor 31 december</text>

    <!-- punt 3 -->
    <text x="48" y="276" font-size="16" font-weight="bold" fill="#2E3440">31 december 2025</text>
    <text x="48" y="296" font-size="15" fill="#2E3440">Deadline voor de aanpassingen</text>

    <!-- punt 4 -->
    <text x="48" y="396" font-size="16" font-weight="bold" fill="#2E3440">10 maart 2026</text>
    <text x="48" y="416" font-size="15" fill="#2E3440">Eindarrest gerechtshof</text>
    <text x="48" y="436" font-size="14" fill="#4C566A">Dwangsom tot 10 miljoen euro</text>

    <!-- uitleg bij het einde van de stippellijn -->
    <text x="48" y="505" font-size="14" fill="#4C566A">Meta kondigde een bodemprocedure aan.</text>

  </g>
</svg>
